name: Keep CMBC Gallery Updated

on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - '.github/workflows/update-gallery.yml'
      - '.github/scripts/fix_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build phone-ready gallery
        run: python .github/scripts/fix_gallery.py
      - name: Commit gallery updates
        run: |
          git config user.name "CMBC Gallery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html gallery-manifest.json
          git diff --cached --quiet || git commit -m "Keep CMBC photo gallery phone-ready"
          git push
