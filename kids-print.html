<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMBC Kids Corner Printables</title>
<style>
:root{--navy:#071b39;--gold:#ffc83d}*{box-sizing:border-box}body{margin:0;background:#e9eef5;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.toolbar b{color:var(--gold)}button,a{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none}.print-btn{background:var(--gold);color:var(--navy)}.back-btn{background:#fff;color:var(--navy)}.pages{padding:22px}.sheet{width:min(8.5in,100%);min-height:11in;margin:0 auto 22px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;overflow:hidden}.sheet img{display:block;width:100%;height:auto;max-height:11in;object-fit:contain}@media(max-width:700px){.pages{padding:8px}.sheet{min-height:auto}.toolbar{font-size:13px}}@page{size:letter portrait;margin:0}@media print{body{background:#fff}.toolbar{display:none!important}.pages{padding:0}.sheet{width:8.5in;height:11in;min-height:11in;margin:0;box-shadow:none;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}.sheet img{width:100%;height:100%;max-height:none;object-fit:contain}body.mode-color .activity-page{display:none!important}body.mode-activity .color-page{display:none!important}}
</style>
</head>
<body>
<div class="toolbar"><b>🧒 CMBC KIDS CORNER</b><button class="print-btn" onclick="window.print()">🖨️ Print Now</button><a class="back-btn" href="./#kids-corner">← Back to Kids Corner</a></div>
<div class="pages">
<section class="sheet color-page" aria-label="CMBC Kids Corner coloring page"><img src="images/kidscornercolorpage1.png" alt="CMBC Kids Corner coloring page"></section>
<section class="sheet activity-page" aria-label="CMBC Kids Corner Monthly Bible Adventure activity sheet"><img src="images/kidscorneractivitypage1.png" alt="CMBC Kids Corner Monthly Bible Adventure Praise God activity sheet"></section>
</div>
<script>
const mode=new URLSearchParams(location.search).get('print');
if(mode==='color')document.body.classList.add('mode-color');
if(mode==='activity')document.body.classList.add('mode-activity');
</script>
</body>
</html>
